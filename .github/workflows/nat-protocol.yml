name: Native NAT probe checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - name: Build responder
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/nncs" .
